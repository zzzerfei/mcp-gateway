name: mcp-agent

# 生产编排：gateway（NestJS + SQLite）+ web（Vite 构建产物 + Caddy）
# 用法：cd deploy && cp .env.example .env && 填值 && docker compose up -d --build

services:
  gateway:
    build:
      context: ../backend
    image: mcp-agent/gateway:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      NODE_ENV: production
      MGW_HOST: 0.0.0.0
      MGW_DATA_DIR: /app/data
    volumes:
      - ../data:/app/data
    # 只在内网暴露给 web，宿主机不发布 8080（MCP 客户端统一走 web 的 /mcp）
    expose:
      - "8080"
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  web:
    build:
      context: ../frontend
      args:
        VITE_LOGTO_ENDPOINT: ${VITE_LOGTO_ENDPOINT}
        VITE_LOGTO_APP_ID: ${VITE_LOGTO_APP_ID}
        VITE_LOGTO_AUDIENCE: ${VITE_LOGTO_AUDIENCE}
    image: mcp-agent/web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    depends_on:
      gateway:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
