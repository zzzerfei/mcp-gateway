name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            dir: backend
          - name: frontend
            dir: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.dir }}/package-lock.json
      - name: Install
        working-directory: ${{ matrix.dir }}
        run: npm ci --no-audit --no-fund
      - name: Build
        working-directory: ${{ matrix.dir }}
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -f deploy/Dockerfile.backend -t mcp-gateway-backend:ci .
      - name: Build web image
        run: docker build -f deploy/Dockerfile.nginx -t mcp-gateway-web:ci .
