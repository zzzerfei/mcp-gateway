services:
  backend:
    build:
      context: .
      dockerfile: deploy/Dockerfile.backend
      args:
        DEBIAN_MIRROR: ${DEBIAN_MIRROR:-deb.debian.org}
    env_file:
      - deploy/.env
    environment:
      MGW_HOST: 0.0.0.0
      MGW_PORT: "8080"
      MGW_DATA_DIR: /app/data
    volumes:
      - mgw_data:/app/data
    expose:
      - "8080"
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-fsS", "http://127.0.0.1:8080/healthz" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile.nginx
    ports:
      - "${MGW_BIND_IP:-0.0.0.0}:${MGW_HTTP_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mgw_data:
